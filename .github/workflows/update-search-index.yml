name: Update Search Index

# Runs after Deploy Blog succeeds. Embeds new/changed posts through Workers AI
# and redeploys, so embedding work never delays the post going live. Nothing
# here needs a local computer: it all runs on GitHub Actions and Cloudflare.

on:
  workflow_run:
    workflows: ["Deploy Blog"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-search:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          lfs: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured; skipping embedding update (keyword search stays live)."
            exit 0
          fi
          echo "CLOUDFLARE_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Stop if not configured
        if: env.CLOUDFLARE_CONFIGURED != 'true'
        run: exit 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: blog/requirements.txt

      - name: Install dependencies
        run: pip install -r blog/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: search/worker/package-lock.json

      - name: Install worker test deps
        run: npm ci
        working-directory: search/worker

      # Pre-deploy gate: a red test fails the workflow before anything ships.
      - name: Test search
        run: |
          python -m unittest discover -s search/tests
          node search/worker/test/run_tests.mjs

      - name: Restore blog build cache
        id: blog-build-cache
        uses: actions/cache@v4
        with:
          path: |
            blog/_site
            blog/.build_cache.json
            blog/.build_tools_hash
            search/.cache
          key: blog-build-${{ hashFiles('blog/build.py', 'blog/templates/**', 'blog/static/**', 'search/*.py', 'search/adapters/*.py', 'search/runtime/*', 'search/node/*.mjs', 'search/node/package.json', 'search/node/package-lock.json', 'search/sources.yml') }}-${{ hashFiles('blog/**/*.md') }}
          restore-keys: |
            blog-build-${{ hashFiles('blog/build.py', 'blog/templates/**', 'blog/static/**', 'search/*.py', 'search/adapters/*.py', 'search/runtime/*', 'search/node/*.mjs', 'search/node/package.json', 'search/node/package-lock.json', 'search/sources.yml') }}-
            blog-build-

      - name: Force full rebuild only if build tools changed
        run: |
          TOOLS_HASH="${{ hashFiles('blog/build.py', 'blog/templates/**', 'blog/static/**') }}"
          if [ -f blog/.build_tools_hash ] && [ "$(cat blog/.build_tools_hash)" = "$TOOLS_HASH" ]; then
            echo "Build tools unchanged, keeping incremental cache"
          else
            echo "Build tools changed, forcing full rebuild"
            rm -f blog/.build_cache.json
          fi
          echo "$TOOLS_HASH" > blog/.build_tools_hash

      # SEARCH_REQUIRE_EMBED fails the job before deploy if embedding fails,
      # so a bad run can never downgrade the live hybrid index to keyword-only.
      - name: Build blog with search embeddings
        run: python blog/build.py --cdn
        env:
          SEARCH_BACKEND: cloudflare
          SEARCH_REQUIRE_EMBED: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy/blog
          cp index.html _deploy/index.html
          cp -r blog/_site/* _deploy/blog/
          cp -r shared _deploy/shared
          cp *.log _deploy/
          cp -r blog-writer _deploy/blog-writer
          cp -r movie-writer _deploy/movie-writer
          shopt -s nullglob
          for dir in movies books people places podcasts products shopping; do
            mkdir -p _deploy/$dir
            cp $dir/index.html _deploy/$dir/index.html
            # Copy any sibling JS/CSS the page needs (e.g. movies/edit-online.js)
            for asset in $dir/*.js $dir/*.css; do
              cp "$asset" _deploy/$dir/
            done
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
