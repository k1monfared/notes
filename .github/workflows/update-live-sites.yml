name: Update live sites

on:
  schedule:
    # Daily at 07:23 UTC. Off the hour to avoid the busiest window.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-live-sites
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate live sites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_live_sites.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- shared/live-sites.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to shared/live-sites.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/live-sites.json
          git commit -m "chore: update live sites"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits pushed with the default GITHUB_TOKEN do not trigger other
      # workflows, so dispatch the deploy on purpose when the data changed.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-blog.yml --ref main
