<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    :root {
      --bg: #fff;
      --text: #222;
      --text-muted: #666;
      --link: #0366d6;
      --link-hover: #0550ae;
      --border: #e1e4e8;
      --header-bg: #fafbfc;
      --card-bg: #fafbfc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a2e;
        --text: #e0e0e0;
        --text-muted: #999;
        --link: #58a6ff;
        --link-hover: #79c0ff;
        --border: #30363d;
        --header-bg: #16213e;
        --card-bg: #16213e;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0;
    }
    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
    }
    h1 {
      margin: 2rem 0 1.5rem;
      font-size: 1.5rem;
    }
    .cards {
      display: grid;
      gap: 1rem;
    }
    .card {
      display: block;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s;
    }
    .card:hover {
      border-color: var(--link);
    }
    .card-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--link);
    }
    .card-desc {
      margin-top: 0.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .card-split {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .card-split:hover {
      border-color: var(--link);
    }
    .card-split a {
      flex: 1;
      display: block;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: var(--text);
    }
    .card-split a:first-child {
      border-right: 1px solid var(--border);
    }
    .card-split a:hover {
      background: var(--border);
    }
    .card-split .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    h2 {
      margin: 2.5rem 0 1.25rem;
      font-size: 1.25rem;
    }
    h3 {
      margin: 1.5rem 0 0.75rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #live-sites h3:first-child {
      margin-top: 0;
    }
    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 0.75rem;
    }
    .site-tile {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0.5rem;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.82rem;
      line-height: 1.25;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .site-tile:hover {
      border-color: var(--link);
    }
    .site-tile span {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .site-tile.has-img {
      padding: 0;
      align-items: flex-end;
      color: #fff;
    }
    .site-tile.has-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .site-tile.has-img span {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 0.35rem 0.35rem 0.3rem;
      font-size: 0.72rem;
      -webkit-line-clamp: 2;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0));
    }
    .sites-error {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="/notes/">Notes</a>
    </div>
  </header>
  <main class="container">
    <h1>Notes</h1>
    <div class="cards">
      <a class="card" href="blog/">
        <div class="card-title">Blog</div>
      </a>
      <a class="card" href="movies/">
        <div class="card-title">Movies</div>
      </a>
      <a class="card" href="books/">
        <div class="card-title">Books</div>
      </a>
      <a class="card" href="podcasts/">
        <div class="card-title">Podcasts</div>
      </a>
      <a class="card" href="people/">
        <div class="card-title">People</div>
      </a>
      <a class="card" href="places/">
        <div class="card-title">Places</div>
      </a>
      <a class="card" href="products/">
        <div class="card-title">Products</div>
      </a>
      <a class="card" href="shopping/">
        <div class="card-title">Shopping</div>
      </a>
    </div>
    <h2>Live sites</h2>
    <div id="live-sites"></div>
  </main>
  <script>
    (function () {
      var root = document.getElementById('live-sites');
      if (!root) return;

      function makeTile(s) {
        var a = document.createElement('a');
        a.className = 'site-tile' + (s.image ? ' has-img' : '');
        a.href = s.url;
        if (s.description) a.title = s.description;
        if (s.image) {
          var img = document.createElement('img');
          img.src = s.image;
          img.alt = '';
          img.loading = 'lazy';
          img.addEventListener('error', function () {
            a.classList.remove('has-img');
            img.remove();
          });
          a.appendChild(img);
        }
        var span = document.createElement('span');
        span.textContent = s.title;
        a.appendChild(span);
        return a;
      }

      fetch('shared/live-sites.json', { cache: 'no-cache' })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(function (data) {
          (data.categories || []).forEach(function (cat) {
            var heading = document.createElement('h3');
            heading.textContent = cat.name;
            root.appendChild(heading);

            var grid = document.createElement('div');
            grid.className = 'sites-grid';
            (cat.sites || []).forEach(function (s) {
              grid.appendChild(makeTile(s));
            });
            root.appendChild(grid);
          });
        })
        .catch(function () {
          root.innerHTML = '<p class="sites-error">Could not load sites.</p>';
        });
    })();
  </script>
</body>
</html>
